<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Courier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" width="960" height="540" aria-label="Jogo Orbital Courier"></canvas>

    <section id="screenPanel" class="screen-panel">
      <div class="panel-content">
        <p class="kicker">Final Challenge</p>
        <h1>Orbital Courier</h1>
        <p id="panelText">
          Colete todos os cristais de energia antes do tempo acabar e desvie dos drones de patrulha.
        </p>
        <div class="button-row">
          <button id="playButton" type="button">Jogar</button>
          <button id="aboutButton" type="button">Sobre</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
